<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>World B: The Grove · NSWP</title>
<meta name="description" content="An NSWP reference world: a test build for portal crossings between independently hosted WebXR worlds.">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; color: #f5f5f5; font: 15px/1.4 system-ui, sans-serif; overflow: hidden; }
  #stage canvas { display: block; touch-action: none; }
  .hud { position: fixed; left: 16px; right: 16px; bottom: 16px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; pointer-events: none; }
  .hud > * { pointer-events: auto; }
  .title { position: fixed; top: 14px; left: 16px; right: 16px; font-weight: 600; text-shadow: 0 1px 3px #000; pointer-events: none; }
  .title small { display: block; font-weight: 400; opacity: .75; }
  button { font: inherit; padding: 12px 18px; border-radius: 10px; border: 1px solid rgba(255,255,255,.25); background: rgba(20,22,28,.85); color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  button.primary { background: #2f6df6; border-color: #2f6df6; }
  .leaving #stage { opacity: .4; transition: opacity .3s; }
  .status { flex-basis: 100%; font-size: .9em; text-shadow: 0 1px 3px #000; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="title">World B: The Grove<small>NSWP reference world · drag to look · WASD to walk · click or tap the portal</small></div>
<div id="stage"></div>
<div class="hud">
  <button id="vr-button" class="primary" disabled>Checking for VR…</button>
  <button id="portal-button">Go through the portal</button>
  <button id="home-button" hidden>Back to your lobby</button>
  <button id="room-button">Join the room</button>
  <button id="mic-button" hidden>Turn microphone on</button>
  <button id="invite-button" hidden>Make a private room</button>
  <span id="room-status" class="status" role="status">Joining lets you see and hear others here. It shows your IP address to them.</span>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
